name: Deploy GitHub Pages (FC Career Tracker + INKWELL)

# A repository gets exactly one Pages site, and this one was already serving
# FC Career Tracker from the repository root before INKWELL existed. Publishing
# only inkwell/dist would replace the whole site and take the tracker offline —
# which matters because it stores its data in the browser, so its users would
# lose the page they need in order to export a backup.
#
# So this assembles both: the tracker keeps the root, INKWELL is published
# underneath it at /inkwell/.

on:
  push:
    branches: [main, master]
    paths:
      # INKWELL
      - 'inkwell/**'
      # FC Career Tracker's published files, so edits to it redeploy too
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'assets/**'
      - '404.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC, with no long-lived secret.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but
# don't queue up more than one pending run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inkwell/package-lock.json

      - name: Install INKWELL dependencies
        working-directory: inkwell
        run: npm ci

      - name: Type-check, lint, and test
        working-directory: inkwell
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build INKWELL
        working-directory: inkwell
        # INKWELL sits at /<repo>/inkwell/, so its asset prefix has to include
        # both segments or every script 404s.
        #
        # The Firebase values come from repository *variables*, not secrets:
        # every VITE_ value is compiled into the public JavaScript bundle, so
        # marking them secret would disguise rather than prevent disclosure.
        # Firebase web config is meant to be public — access is enforced by
        # firestore.rules, not by hiding the API key — and secrets would also
        # be masked in the build log, turning a typo into a mystery.
        #
        # Left unset, the build ships with cloud accounts switched off; the
        # app is local-first and fully usable either way.
        env:
          INKWELL_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Assemble both sites
        # Copied explicitly rather than by excluding things, so that adding a
        # directory to the repository never silently publishes it.
        run: |
          mkdir -p _site/tracker
          # INKWELL owns the root: the repository is named for it, and a site
          # people visit daily should not carry an extra path segment that a
          # phone keyboard can capitalise into a 404.
          cp -r inkwell/dist/. _site/
          cp 404.html _site/
          # FC Career Tracker moves down a level rather than being deleted. It
          # uses relative URLs throughout, so it works unchanged from any depth,
          # and its service worker's scope narrows to /tracker/ along with it —
          # which keeps it away from INKWELL entirely.
          cp index.html manifest.webmanifest sw.js _site/tracker/
          cp -r assets _site/tracker/assets
          echo "Assembled tree:"
          find _site -maxdepth 2 -not -path '_site/assets/*' -not -path '_site/tracker/assets/*' | sort

      - name: Verify both sites are intact
        # Each of these has a specific failure it prevents, and every one of
        # them is silent otherwise — a blank page or a missing site.
        env:
          EXPECTED: /${{ github.event.repository.name }}/
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # INKWELL owns the root.
          grep -q "Inkwell" _site/index.html \
            || fail "The root site is not INKWELL."
          [ -d _site/assets ] || fail "INKWELL's built assets are missing."
          [ -f _site/404.html ] || fail "404.html is missing; mis-cased URLs would not self-correct."

          # Built for the right base. A rename of the repository changes this,
          # which is exactly how the site broke once before.
          if grep -qE '(src|href)="/assets/' _site/index.html; then
            fail "INKWELL references a bare /assets/ — INKWELL_BASE_PATH did not apply."
          fi
          grep -q "$EXPECTED" _site/index.html \
            || fail "INKWELL does not reference $EXPECTED — is the repository name what you expect?"

          # The tracker must survive the move, intact.
          grep -q "FC Career Tracker" _site/tracker/index.html \
            || fail "FC Career Tracker is missing from /tracker/."
          [ -f _site/tracker/assets/app.js ] || fail "Tracker assets are missing."
          [ -f _site/tracker/sw.js ] || fail "The tracker service worker is missing."

          echo "Both sites verified."
          echo "INKWELL asset references:"
          grep -oE '(src|href)="[^"]*"' _site/index.html | head -5

      - name: Report which mode INKWELL built in
        run: |
          if [ -n "${{ vars.VITE_FIREBASE_API_KEY }}" ]; then
            echo "::notice::INKWELL built WITH cloud accounts (project ${{ vars.VITE_FIREBASE_PROJECT_ID }}). Confirm ${{ github.repository_owner }}.github.io is on the Firebase authorised domains list, or sign-in will be rejected."
          else
            echo "::notice::INKWELL built WITHOUT cloud accounts — no VITE_FIREBASE_API_KEY repository variable is set. The app is local-first and fully usable; the Account tab will explain that sign-in is unavailable. See inkwell/docs/CLOUD_AUTH_SETUP.md to enable it."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
