name: Build INKWELL Windows Installer

on:
  # A manual run can publish too, not only build. Pushing a tag is not
  # available from every environment this repo is worked on from, and a build
  # artifact nobody can reach without signing in to GitHub is not a download.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (leave empty to only build)'
        required: false
        default: ''
  push:
    tags:
      - 'inkwell-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: inkwell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inkwell/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: inkwell/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck, lint, and tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      # Whether the in-app updater can be signed decides how the build runs,
      # so it is settled before the build rather than discovered at the end of
      # one. A malformed key used to fail the job *after* a perfectly good
      # installer had already been produced, so nothing was published at all
      # — which is the worst of both outcomes.
      #
      # A minisign secret key is two lines: a comment beginning "untrusted
      # comment:", then the base64. Pasting only the base64 into the secret
      # gives "Missing comment in secret key", which is exactly what happened.
      - name: Check the updater signing key
        id: signing
        shell: bash
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Two shapes are accepted, because tauri accepts both: the raw
          # two-line minisign document, or that document base64-encoded as a
          # single line (which is what `tauri signer generate` writes to the
          # key file, and the easiest thing to paste into a secret).
          #
          # The single-line shape is scrubbed of whitespace first. A key
          # pasted from a phone arrives with a line break folded into it, and
          # while `base64 -d` shrugs newlines off, tauri's decoder fails the
          # whole build over one: "Invalid symbol 10, offset 348" — which is
          # this workflow's way of saying a paste artifact, not a bad key.
          if printf '%s' "$RAW_SIGNING_KEY" | head -n1 | grep -qi 'untrusted comment'; then
            echo 'usable=true' >> "$GITHUB_OUTPUT"
            {
              echo 'TAURI_SIGNING_PRIVATE_KEY<<INKWELL_KEY_EOF'
              printf '%s\n' "$RAW_SIGNING_KEY"
              echo 'INKWELL_KEY_EOF'
            } >> "$GITHUB_ENV"
          else
            CLEAN=$(printf '%s' "$RAW_SIGNING_KEY" | tr -d '[:space:]')
            if printf '%s' "$CLEAN" | base64 -d 2>/dev/null | head -n1 | grep -qi 'untrusted comment'; then
              echo 'usable=true' >> "$GITHUB_OUTPUT"
              echo "::add-mask::$CLEAN"
              echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN" >> "$GITHUB_ENV"
            else
              echo 'usable=false' >> "$GITHUB_OUTPUT"
              echo "::warning title=Updater signing skipped::TAURI_SIGNING_PRIVATE_KEY is missing or is not a whole minisign secret key (it must include its 'untrusted comment:' first line, or be the single-line base64 of that document). The installer is still built and published; in-app updates will not be offered until the secret is fixed and a new release is made."
            fi
          fi

      # Authenticode (SmartScreen) signing needs a purchased certificate — see
      # inkwell/docs/WINDOWS_SIGNING.md — and is not wired up here. The
      # installer works regardless; Windows shows an "unrecognised app" prompt.
      - name: Build installer
        if: steps.signing.outputs.usable == 'true'
        run: npm run desktop:build
        env:
          # TAURI_SIGNING_PRIVATE_KEY arrives via GITHUB_ENV from the check
          # step above, already scrubbed of paste artifacts — not straight
          # from the secret, which may carry an embedded newline.
          #
          # The updater key was generated with an empty password, so this is
          # hardcoded rather than read from a secret: a stale value in the
          # old password secret would fail decryption and kill the signing
          # this workflow just verified was possible.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # Tauri signs the installer but writes no manifest — the .sig proves an
      # update genuine; latest.json is what tells running apps one exists.
      # The app polls releases/latest/download/latest.json, so every signed
      # release must carry one or auto-update silently never fires.
      - name: Write the updater manifest
        if: steps.signing.outputs.usable == 'true' && (startsWith(github.ref, 'refs/tags/inkwell-v') || inputs.release_tag != '')
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node -e '
            const fs = require("fs")
            const path = require("path")
            const version = require("./package.json").version
            const dir = "src-tauri/target/release/bundle/nsis"
            const exe = fs.readdirSync(dir).find((f) => f.endsWith(".exe"))
            if (!exe) throw new Error("no installer found to describe")
            const signature = fs.readFileSync(path.join(dir, exe + ".sig"), "utf8").trim()
            const url = `https://github.com/ash6677-cyber/ink/releases/download/${process.env.RELEASE_TAG}/${encodeURIComponent(exe)}`
            const manifest = {
              version,
              notes: `INKWELL ${version}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature, url } },
            }
            fs.writeFileSync(
              "src-tauri/target/release/bundle/latest.json",
              JSON.stringify(manifest, null, 2),
            )
            console.log("latest.json points at", url)
          '

      # Updater artifacts are turned off rather than produced unsigned: a .sig
      # that cannot verify is worse than no .sig, because the updater would
      # offer the update and then reject it.
      - name: Build installer (without updater signing)
        if: steps.signing.outputs.usable != 'true'
        shell: bash
        run: |
          # Through a file rather than on the command line: the runner's
          # default shell is PowerShell, which ate the quoting of a JSON
          # literal and handed tauri `{\` to parse.
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > no-updater.json
          npm run desktop:build -- --config no-updater.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: INKWELL-Windows-Installer
          path: |
            inkwell/src-tauri/target/release/bundle/nsis/*.exe
            inkwell/src-tauri/target/release/bundle/nsis/*.sig
            inkwell/src-tauri/target/release/bundle/*.json
          # The .exe must exist; the .sig and latest.json only exist when the
          # updater could be signed, and their absence is already warned about.
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/inkwell-v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          # The tag must land on the commit that was actually built. Without
          # this it defaults to the default branch, so the release's source
          # links pointed at older code than the installer beside them.
          target_commitish: ${{ github.sha }}
          name: INKWELL ${{ inputs.release_tag || github.ref_name }}
          # The updater reads latest.json from the newest release, so a build
          # that is not ready to be offered to everyone must not become one.
          make_latest: true
          body: |
            The Windows app for INKWELL.

            Download `INKWELL_*_x64-setup.exe` below and run it. Windows will
            warn about an unrecognised app the first time — the installer is
            not certificate-signed yet, so choose **More info**, then
            **Run anyway**.

            Your books are saved as ordinary files on your computer, the app
            works with no internet at all, and it updates itself from here.
          files: |
            inkwell/src-tauri/target/release/bundle/nsis/*.exe
            inkwell/src-tauri/target/release/bundle/nsis/*.sig
            inkwell/src-tauri/target/release/bundle/*.json
