name: Build INKWELL Windows Installer

on:
  # A manual run can publish too, not only build. Pushing a tag is not
  # available from every environment this repo is worked on from, and a build
  # artifact nobody can reach without signing in to GitHub is not a download.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (leave empty to only build)'
        required: false
        default: ''
  push:
    tags:
      - 'inkwell-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: inkwell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inkwell/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: inkwell/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck, lint, and tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      # This builds a valid, working NSIS installer either way:
      # - Authenticode (SmartScreen) signing needs a purchased certificate —
      #   see inkwell/docs/WINDOWS_SIGNING.md — and isn't wired up here yet.
      # - Updater-artifact signing (TAURI_SIGNING_PRIVATE_KEY) uses a keypair
      #   generated locally with `tauri signer generate`, no purchase needed;
      #   set it as a repo secret and this step picks it up automatically.
      #   Without it, `createUpdaterArtifacts` still runs but the .sig files
      #   won't verify, so the in-app updater will reject the update.
      - name: Build installer
        run: npm run desktop:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: INKWELL-Windows-Installer
          path: |
            inkwell/src-tauri/target/release/bundle/nsis/*.exe
            inkwell/src-tauri/target/release/bundle/nsis/*.sig
            inkwell/src-tauri/target/release/bundle/*.json
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/inkwell-v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: INKWELL ${{ inputs.release_tag || github.ref_name }}
          # The updater reads latest.json from the newest release, so a build
          # that is not ready to be offered to everyone must not become one.
          make_latest: true
          body: |
            The Windows app for INKWELL.

            Download `INKWELL_*_x64-setup.exe` below and run it. Windows will
            warn about an unrecognised app the first time — the installer is
            not certificate-signed yet, so choose **More info**, then
            **Run anyway**.

            Your books are saved as ordinary files on your computer, the app
            works with no internet at all, and it updates itself from here.
          files: |
            inkwell/src-tauri/target/release/bundle/nsis/*.exe
            inkwell/src-tauri/target/release/bundle/nsis/*.sig
            inkwell/src-tauri/target/release/bundle/*.json
